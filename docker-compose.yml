services:
  # The LGTM all-in-one backend
  lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - "3000:3000"      
      - "4317:4317"     
      - "4318:4318"
    networks:
      - lgtm-demo

  # The Telemetry Pipeline
  alloy:
    image: grafana/alloy:latest
    volumes:
      - ./config.river:/etc/alloy/config.river
    command: run --server.http.listen-addr=0.0.0.0:12345 --stability.level=experimental /etc/alloy/config.river
    ports:
      - "12345:12345"
      - "12346:4317"
    networks:
      - lgtm-demo

  # PostgreSQL Database
  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=demo
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - lgtm-demo

  # FastAPI Application
  app:
    build: ./fastapi
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://alloy:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_SERVICE_NAME=fastapi-app
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=demo
      - OTEL_PYTHON_LOG_CORRELATION=true
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_LOG_LEVEL=debug
      - OTEL_PYTHON_LOG_LEVEL=debug
      
    command: opentelemetry-instrument uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
    - "8000:8000"
    depends_on:
      - alloy
      - db
    networks:
      - lgtm-demo

networks:
  lgtm-demo: