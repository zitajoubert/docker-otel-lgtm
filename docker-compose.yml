services:
  # The LGTM all-in-one backend
  lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - "3000:3000"   # Grafana Web UI
      - "12345:12345" # Alloy UI (if running inside this container)
    networks:
      - lgtm-demo

  # The Telemetry Pipeline
  alloy:
    image: grafana/alloy:latest
    volumes:
      - ./config.river:/etc/alloy/config.river
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.river
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "12345:12345"
    networks:
      - lgtm-demo

  # PostgreSQL Database
  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=demo
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - lgtm-demo

  # FastAPI Application
  app:
    build: ./fastapi
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://alloy:4318
      - OTEL_SERVICE_NAME=fastapi-app
      - OTEL_PYTHON_LOG_CORRELATION=true
    depends_on:
      - alloy
      - db
    networks:
      - lgtm-demo

networks:
  lgtm-demo: